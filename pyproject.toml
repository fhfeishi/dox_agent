[project]
name = "dox-agent"
version = "0.2.0"
description = "Local fund-report corpus QA with FastAPI, LangGraph and Deep Agents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.9,<1",
  "langchain>=1.3,<2", "langchain-openai>=1,<2", "langgraph>=1.2,<2",
  "deepagents>=0.7.8,<0.8", "langsmith>=0.8,<1",
  "pydantic>=2.7,<3", "pydantic-settings>=2.4,<3", "rank-bm25==0.2.2",
  "python-docx>=1.1,<2",
  "mineru>=4.0,<5",
]

[project.optional-dependencies]
embedding = ["langchain-huggingface>=1,<2", "langchain-chroma>=1,<2", "sentence-transformers>=5,<6"]
web = ["crawl4ai>=0.9,<0.10"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["prompts/*.md", "templates/*.md"]

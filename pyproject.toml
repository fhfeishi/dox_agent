[project]
name = "dox-agent"
version = "0.2.0"
description = "Local fund-report corpus QA with FastAPI and LangGraph."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.9,<1",
  "langchain>=1.3,<2", "langchain-openai>=1,<2", "langgraph>=1.2,<2",
  # Removed "deepagents>=0.7.8,<0.8" (F4/Q3, 2026-10-19): never imported. See .logsdev/cleanup-log.md.
  "langsmith>=0.8,<1",
  "pydantic>=2.7,<3", "pydantic-settings>=2.4,<3", "rank-bm25==0.2.2",
  "python-docx>=1.1,<2", "pypdf>=6,<7", "olefile>=0.47,<1",
  "Pillow>=10,<13", "pypdfium2>=5,<6",
  "mineru>=4.0,<5",
]

[project.optional-dependencies]
embedding = ["langchain-huggingface>=1,<2", "langchain-chroma>=1,<2", "sentence-transformers>=5,<6"]
web = ["crawl4ai>=0.9,<0.10"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

# Fixed rule set (upgrade plan card Q1, 2026-10-19); the version is pinned by uv.lock.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# House style, not defects: the code keeps short related statements on one line, and long Chinese
# messages and SQL read better unwrapped. Reformatting ~1,300 lines would bury real changes in churn.
ignore = [
    "E501",  # line length
    "E701",  # one-line `if x: return`
    "E702",  # `a = 1; b = 2` for tightly related assignments
    "E731",  # small named lambdas used as local helpers
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through default values; these calls are not shared mutable state.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["prompts/*.md", "templates/*.md"]

<script>
const short = (n) => n.replace(/^自然科学基金-/, "");
const fmt = (n) => Number(n).toLocaleString("zh-CN", { maximumFractionDigits: 0 });
const rows = DATA.filter((r) => r.projects > 0).sort((a, b) => b.projects - a.projects);
const most = Math.max(1, ...rows.map((r) => r.projects));
const years = (r) => (r.start_years && r.start_years.length ? `${r.start_years[0]}–${r.start_years.at(-1)}` : "年份待核对");
const money = (r) => (r.funding && r.funding.projects ? `${fmt(Number(r.funding.total_yuan) / 10000)} 万元（${r.funding.projects} 个项目）` : "");
let chosen = rows[0];

const $ = (id) => document.getElementById(id);

/* --- left: ranked bars --- */
$("bars").innerHTML = rows.map((r) => `
  <li>
    <button type="button" class="bar-row" data-id="${r.corpus_id}" aria-pressed="${r.corpus_id === chosen.corpus_id}">
      <span class="name" title="${short(r.name)}">${short(r.name)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(2, (r.projects / most) * 100)}%"></span></span>
      <span class="count">${r.projects}</span>
    </button>
  </li>`).join("");

/* --- bottom: small library cards --- */
$("cards").innerHTML = rows.map((r) => `
  <button type="button" class="lib" data-id="${r.corpus_id}" aria-pressed="${r.corpus_id === chosen.corpus_id}">
    <span class="lib-top"><b title="${short(r.name)}">${short(r.name)}</b><b>${r.projects}</b></span>
    <span class="track"><span class="fill" style="width:${Math.max(2, (r.projects / most) * 100)}%"></span></span>
    <small>${years(r)}${money(r) ? ` · ${fmt(Number(r.funding.total_yuan) / 10000)} 万元` : ""}</small>
  </button>`).join("");

/* --- right: the radar, geometry straight from components/Charts.tsx --- */
const ceiling = (v) => {
  if (v <= 1) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((c) => c >= v);
};
const clip = (text, n) => (text.length > n ? text.slice(0, n - 1) + "…" : text);

function radar(fields, total) {
  const n = fields.length;
  const c = 150, r = 100;
  const top = Math.max(...fields.map(([, v]) => v), 0);
  const max = Math.max(top, 1, Math.min(total, ceiling(top * 1.25)));
  const point = (i, v) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return [c + Math.cos(a) * r * v, c + Math.sin(a) * r * v];
  };
  const ring = (f) => fields.map((_, i) => point(i, f).join(",")).join(" ");
  const spokes = fields.map((_, i) => {
    const [x, y] = point(i, 1);
    return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line-cool)" />`;
  }).join("");
  const rings = [0.25, 0.5, 0.75, 1].map((f) =>
    `<polygon points="${ring(f)}" fill="none" stroke="var(--line-cool)" />`).join("");
  const scale = [0.5, 1].map((f) =>
    `<text x="${c + 4}" y="${c - r * f + 10}" font-size="9" fill="var(--stone)">${Number((max * f).toFixed(1))}</text>`).join("");
  const shape = `<polygon points="${fields.map(([, v], i) => point(i, v / max).join(",")).join(" ")}"
    fill="var(--primary)" fill-opacity=".22" stroke="var(--primary)" stroke-width="2" />`;
  const dots = fields.map(([label, v], i) => {
    const [x, y] = point(i, v / max);
    return `<circle cx="${x}" cy="${y}" r="3" fill="var(--primary)"><title>${label}：${v} 个项目</title></circle>`;
  }).join("");
  const labels = fields.map(([label, v], i) => {
    const [x, y] = point(i, 1.22);
    const anchor = Math.abs(x - c) < 8 ? "middle" : x > c ? "start" : "end";
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11" fill="var(--slate)">${clip(label, 10)} ${v}</text>`;
  }).join("");
  return `<svg id="radar" viewBox="-90 -6 480 312" class="mx-auto" role="img" aria-label="应用方向分布">
    ${rings}${spokes}${scale}${shape}${dots}${labels}</svg>`;
}

function paint() {
  const r = chosen;
  $("dname").textContent = short(r.name);
  const fund = money(r);
  $("dmeta").textContent = `${r.projects} 个项目 · 立项 ${years(r)}${fund ? ` · 已知经费 ${fund}` : ""}`;
  const fields = (r.fields || []).slice(0, 8);
  if (fields.length >= 3) {
    $("radar").outerHTML = radar(fields, r.projects);
    const top = Math.max(...fields.map(([, v]) => v), 0);
    const max = Math.max(top, 1, Math.min(r.projects, ceiling(top * 1.25)));
    $("dcap").innerHTML = `外圈为 <b>${max}</b> 个项目${max === r.projects ? "，即全部" : `，共 ${r.projects}`}`;
  } else {
    // Fewer than three directions: the real chart falls back to bars rather than drawing a sliver.
    $("radar").outerHTML = `<svg id="radar" viewBox="0 0 320 ${fields.length * 30 + 20}" role="img" aria-label="应用方向分布">
      ${fields.map(([label, v], i) => `<g transform="translate(0 ${i * 30 + 14})">
        <text x="0" y="4" font-size="11" fill="var(--slate)">${clip(label, 12)}</text>
        <rect x="110" y="-6" width="${Math.max(2, (v / Math.max(1, ...fields.map(([, n]) => n))) * 150)}" height="12" rx="6" fill="var(--primary)" fill-opacity=".35"/>
        <text x="270" y="4" font-size="11" fill="var(--steel)">${v}</text></g>`).join("")}
    </svg>`;
    $("dcap").innerHTML = `该领域只归纳出 <b>${fields.length}</b> 个应用方向，不足以画雷达`;
  }
  document.querySelectorAll(".bar-row, .lib").forEach((el) => {
    el.setAttribute("aria-pressed", String(el.dataset.id === r.corpus_id));
  });
}

document.addEventListener("click", (event) => {
  const hit = event.target.closest(".bar-row, .lib");
  if (!hit) return;
  chosen = rows.find((r) => r.corpus_id === hit.dataset.id) || chosen;
  paint();
});

const items = rows.reduce((n, r) => n + r.lineage.items, 0);
const projects = rows.reduce((n, r) => n + r.projects, 0);
const dates = rows.flatMap((r) => r.start_years || []);
$("foot").innerHTML = `数据来自 <code>.knowledge/自然科学基金-*</code> 的 lineage 与项目索引：${rows.length} 个资料库 ·
  ${fmt(items)} 条技术 · ${fmt(projects)} 个项目 · 立项 ${Math.min(...dates)}–${Math.max(...dates)}。
  项目在各库内按批准号去重，跨库合计未去重；经费只统计报告里给出的金额。demo 生成于 2026-10-21。`;

paint();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资料库概览 · 积累分布图（2026-10-21 起）</title>
<style>
  /* Tokens copied from frontend/src/styles/globals.css so the demo reads as the product. */
  :root {
    --canvas: #fff;
    --page-cool: #f5f7fa;
    --surface-cool: #f6f8fb;
    --surface-soft: #fafaf9;
    --surface: #f6f5f4;
    --track: #edf1f5;
    --line-cool: #e2e7ee;
    --line-cool-soft: #edf0f4;
    --line-cool-strong: #b4c1d2;
    --selected-cool: #eef3f9;
    --heading: #1f3147;
    --ink: #1a1a1a;
    --slate: #5d5b54;
    --steel: #787671;
    --stone: #777e87;
    --muted-cool: #8a98aa;
    --muted-cool-soft: #b4bdc9;
    --bar: #7f97b1;
    --primary: #345a78;
    --primary-pressed: #25435c;
    --primary-soft: #eaf0f5;
    --banner-1: #172a40;
    --banner-2: #1f3a57;
    --banner-3: #2c5373;

    --terrain-empty: #f5f8fa;
    --terrain-shallow: #f7f6f3;
    --terrain-plot: #fcfdfd;
    --terrain-grid: #e4edef;
    --terrain-sep: #afc2ca;
    --terrain-dot: #3b5d70;
    --terrain-dot-on: #2e8b7a;
    --terrain-halo: #2e8b7a;
    --terrain-warn: #b4553c;
    --terrain-warn-deep: #8c4a2e;
    --terrain-warn-soft: #fbf1ec;
    --terrain-amber-soft: #fbf4e5;
    --terrain-amber-ink: #8a6a2f;
    --terrain-panel: #f4f8f9;
    --terrain-card-line: #e7eef1;
    --dim-scene: #4e8fa6;
    --dim-issue: #2e8b7a;
    --dim-tech: #75af98;
    --dim-outcome: #b08a50;
    --m-0: #d2dbde;
    --m-1: #c0d6d4;
    --m-2: #a2cac1;
    --m-3: #7cb8a9;
    --m-4: #4ca391;
    --m-5: #2e8b7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page-cool); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-variant-numeric: tabular-nums; }
  .page { max-width: 1200px; margin: 0 auto; padding: 28px 32px 56px; }
  .head-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
  .idx { font-size: 12px; font-weight: 600; color: var(--muted-cool); font-variant-numeric: tabular-nums; }
  h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; color: var(--heading); }
  .head-line .note { font-size: 12px; color: var(--steel); }
  .lede { margin: 8px 0 14px; max-width: 82ch; font-size: 12px; line-height: 20px; color: var(--stone); }
  .lede b { font-weight: 600; color: var(--slate); }

  /* ---------- the card ---------- */
  .card { overflow: hidden; border: 1px solid var(--line-cool); border-radius: 16px; background: var(--canvas); }
  .card-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-cool-soft); }
  .card-head h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--heading); }
  .axes { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
  .caliber {
    display: inline-flex; align-items: center; gap: 4px; padding: 0 0 1px; cursor: pointer;
    border: 0; border-bottom: 1px dashed var(--muted-cool-soft); background: none;
    font: inherit; font-size: 12px; color: var(--muted-cool); transition: color 140ms ease, border-color 140ms ease;
  }
  .caliber:hover { color: var(--terrain-dot-on); border-bottom-color: var(--terrain-dot-on); }
  .caliber b { font-weight: 500; color: var(--slate); }
  .caliber i { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--muted-cool-soft); color: var(--canvas); font-size: 9px; font-style: normal; font-weight: 700; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .filter { padding: 4px 10px; border: 1px solid var(--line-cool); border-radius: 6px; background: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--steel); transition: all 140ms ease; }
  .filter:hover { border-color: var(--line-cool-strong); }
  .filter[aria-pressed="true"] { border-color: var(--terrain-dot-on); background: var(--selected-cool); color: var(--terrain-dot-on); font-weight: 500; }
  .filter.gap[aria-pressed="true"] { border-color: var(--terrain-warn); background: var(--terrain-warn-soft); color: var(--terrain-warn-deep); }

  .body { display: grid; grid-template-columns: minmax(0, 1fr); align-items: stretch; }
  @media (min-width: 900px) { .body { grid-template-columns: minmax(0, 1fr) 336px; } }
  .plot-wrap { position: relative; display: flex; min-width: 0; flex-direction: column; justify-content: center; padding: 8px; }
  .plot-wrap svg { display: block; width: 100%; }

  .tick { font-size: 11px; fill: var(--muted-cool); font-variant-numeric: tabular-nums; }
  .axis-title { font-size: 12px; fill: var(--steel); }
  .q-label { font-size: 11px; fill: var(--muted-cool); }
  .q-empty { font-size: 12px; fill: var(--muted-cool-soft); }
  .quad { cursor: pointer; }
  .quad text { transition: fill 140ms ease; }
  .quad:hover text { fill: var(--terrain-dot-on); }
  .quad:hover rect { stroke: var(--terrain-dot-on); }
  .dot-hit { cursor: pointer; }
  .label { font-size: 12px; fill: var(--slate); pointer-events: none; transition: fill 140ms ease; }
  .label[data-on="true"] { fill: var(--heading); font-weight: 600; }
  .dot { transition: r 160ms ease, fill 160ms ease, fill-opacity 160ms ease; }

  .tip { position: absolute; z-index: 20; max-width: 250px; padding: 8px 11px; border-radius: 8px; background: var(--banner-1); color: #fff; box-shadow: 0 8px 24px -8px rgb(9 28 40 / 45%); pointer-events: none; }
  .tip b { display: block; font-size: 12px; font-weight: 600; }
  .tip .k { font-size: 12px; color: var(--muted-cool-soft); }
  .tip .v { font-family: Georgia, serif; font-variant-numeric: tabular-nums; color: #bfe3dd; }

  /* ---------- the right panel ---------- */
  .panel { display: flex; min-width: 0; flex-direction: column; padding: 14px 16px 16px; border-left: 1px solid var(--line-cool); background: var(--terrain-panel); }
  @media (max-width: 899px) { .panel { border-left: 0; border-top: 1px solid var(--line-cool); } }
  .panel .eyebrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .panel .eyebrow p { margin: 0; font-size: 12px; letter-spacing: 1.5px; color: var(--muted-cool); }
  .panel .eyebrow span { font-size: 12px; color: var(--muted-cool-soft); }
  .panel h3 { margin: 4px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; line-height: 24px; font-weight: 600; color: var(--heading); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 10px; border-top: 1px solid var(--line-cool); border-bottom: 1px solid var(--line-cool); }
  .stats > div { padding: 8px 0; }
  .stats > div + div { padding-left: 12px; border-left: 1px solid var(--line-cool-soft); }
  .big { display: block; font-family: Georgia, serif; font-variant-numeric: tabular-nums; font-size: 22px; line-height: 1; font-weight: 400; color: var(--heading); }
  .big.stat { font-size: 28px; }
  .big.warn { color: var(--terrain-warn); }
  .big.ok { color: var(--terrain-dot-on); }
  .stats small, .block small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted-cool); }
  .block { margin-top: 12px; }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .block-head span { font-size: 12px; color: var(--slate); }
  .block-head em { font-size: 12px; font-style: normal; color: var(--muted-cool-soft); }
  .pill { padding: 1px 8px; border: 1px solid var(--line-cool); border-radius: 999px; background: var(--canvas); cursor: pointer; font: inherit; font-size: 12px; color: var(--muted-cool); transition: all 140ms ease; }
  .pill:hover { border-color: var(--terrain-dot-on); color: var(--terrain-dot-on); }

  .bars { display: flex; align-items: flex-end; gap: 6px; height: 52px; }
  .bar { flex: 1; position: relative; padding: 0; border: 0; border-radius: 3px 3px 1px 1px; cursor: default; transform-origin: bottom; animation: bar-in 520ms cubic-bezier(.16,1,.3,1) both; transition: filter 140ms ease, transform 160ms ease; }
  .bar:hover { filter: brightness(1.07); transform: scaleY(1.05); }
  .bars-axis { display: flex; gap: 6px; margin-top: 2px; }
  .bars-axis > * { flex: 1; text-align: center; font-size: 12px; color: var(--muted-cool-soft); }

  .dims { display: flex; flex-direction: column; gap: 2px; }
  .dim { display: grid; grid-template-columns: 2.7em minmax(0, 1fr) 3.1em; align-items: center; gap: 8px; padding: 6px 0; width: 100%; border: 0; border-radius: 4px; background: none; cursor: pointer; font: inherit; text-align: left; transition: background-color 140ms ease; }
  .dim:hover { background: var(--selected-cool); }
  .dim span:first-child { font-size: 12px; color: var(--slate); }
  .dim .track { position: relative; height: 8px; overflow: hidden; border-radius: 999px; background: var(--track); }
  .dim .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
  .dim .gap { position: absolute; inset: 0 0 0 auto; background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--terrain-warn) 40%, transparent) 0 2px, transparent 2px 5px); }
  .dim b { font-family: Georgia, serif; font-size: 12px; font-weight: 400; text-align: right; color: var(--slate); }
  .dim b.low { color: var(--terrain-warn); }

  .note-warn { display: flex; gap: 6px; margin: 8px 0 0; padding: 6px 8px; border-left: 2px solid var(--terrain-warn); border-radius: 0 4px 4px 0; background: var(--terrain-warn-soft); font-size: 12px; line-height: 20px; color: var(--terrain-warn-deep); }
  .preview { margin-top: auto; padding-top: 12px; }
  .preview button { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 8px 12px; border: 0; border-radius: 8px; background: var(--terrain-dot-on); color: var(--canvas); cursor: pointer; font: inherit; font-size: 12px; transition: background-color 140ms ease, transform 140ms ease; }
  .preview button:hover { background: var(--primary-pressed); transform: translateY(-1px); }

  /* ---------- the readout strip ---------- */
  .readout { display: grid; border-top: 1px solid var(--line-cool); background: var(--terrain-panel); }
  @media (min-width: 900px) { .readout { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .readout > div { padding: 10px 16px; border-top: 1px solid var(--line-cool-soft); }
  .readout > div:first-child { border-top: 0; }
  @media (min-width: 900px) { .readout > div { border-top: 0; border-left: 1px solid var(--line-cool); } .readout > div:first-child { border-left: 0; } }
  .readout p { margin: 0; }
  .readout .label { margin-bottom: 4px; font-size: 12px; letter-spacing: .04em; color: var(--muted-cool-soft); }
  .readout .text { font-size: 12px; line-height: 20px; color: var(--slate); }
  .readout em { font-style: normal; color: var(--terrain-warn); }
  .readout b { font-family: Georgia, serif; font-weight: 400; color: var(--heading); }

  /* ---------- the anchored explanation ---------- */
  .pop { position: fixed; z-index: 130; }
  .pop-card { position: relative; max-width: calc(100vw - 24px); padding: 14px 16px; border: 1px solid var(--line-cool); border-radius: 12px; background: #fff; box-shadow: 0 22px 48px -16px rgb(16 42 58 / 28%), 0 2px 8px rgb(16 42 58 / 5%); transform-origin: var(--ox, 50%) var(--oy, 0); animation: pop-in 300ms cubic-bezier(.16,1,.3,1) both; }
  .pop-card h4 { margin: 0; font-size: 14px; font-weight: 600; color: var(--heading); }
  .pop-card .sub { margin: 2px 0 0; font-size: 12px; line-height: 20px; color: var(--muted-cool); }
  .pop-card .sec { padding: 6px 0; border-bottom: 1px solid var(--line-cool-soft); }
  .pop-card .sec:last-child { border-bottom: 0; }
  .pop-card .sec b { font-size: 12px; font-weight: 600; color: var(--heading); }
  .pop-card .sec p { margin: 2px 0 0; font-size: 12px; line-height: 20px; color: var(--steel); }
  .pop-card .amber { margin: 8px 0 0; padding: 8px 10px; border-radius: 4px; background: var(--terrain-amber-soft); font-size: 12px; line-height: 20px; color: var(--terrain-amber-ink); }
  .pop-card .amber b { font-weight: 600; }
  .pop-arrow { position: absolute; width: 10px; height: 10px; margin-left: -5px; background: #fff; border: 1px solid var(--line-cool); transform: rotate(45deg); }
  .pop-arrow[data-up="false"] { border-right: 0; border-bottom: 0; top: -5px; }
  .pop-arrow[data-up="true"] { border-left: 0; border-top: 0; bottom: -5px; }
  .step { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 6px 0; }
  .step .n { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; font-family: Georgia, serif; font-size: 12px; font-weight: 600; color: var(--heading); }
  .step .t { font-size: 12px; font-weight: 600; color: var(--heading); }
  .step .d { margin-top: 2px; font-size: 12px; line-height: 20px; color: var(--muted-cool); }
  .step .c { font-family: Georgia, serif; font-size: 12px; text-align: right; color: var(--steel); }
  .step .c b { display: block; font-weight: 400; color: var(--slate); }

  /* ---------- the preview drawer ---------- */
  .mask { position: fixed; inset: 0; z-index: 100; background: rgb(9 28 40 / 30%); backdrop-filter: blur(2px); animation: fade-in 280ms ease both; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 110; display: flex; flex-direction: column; width: 600px; max-width: 94vw; background: var(--page-cool); box-shadow: -34px 0 70px -26px rgb(9 28 40 / 35%); animation: slide-in 440ms cubic-bezier(.16,1,.3,1) both; }
  .drawer-head { position: relative; overflow: hidden; padding: 22px 26px 20px; background: linear-gradient(120deg, var(--banner-1) 0%, var(--banner-2) 70%); color: #fff; }
  .drawer-head::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--terrain-dot-on), var(--dim-scene)); }
  .drawer-head::after { content: ""; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgb(46 139 122 / 34%), transparent 68%); }
  .drawer-head .eyebrow { position: relative; z-index: 1; margin: 0; font-size: 12px; letter-spacing: 2px; color: #6e93a6; }
  .drawer-head h2 { position: relative; z-index: 1; margin: 4px 0 0; font-size: 22px; line-height: 30px; font-weight: 600; }
  .drawer-head .meta { position: relative; z-index: 1; margin: 4px 0 0; font-size: 12px; color: #9db2c4; }
  .drawer-stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .drawer-stats > div { border-left: 1px solid rgb(255 255 255 / 15%); padding-left: 12px; }
  .drawer-stats > div:first-child { border-left: 0; padding-left: 0; }
  .drawer-stats b { display: block; font-family: Georgia, serif; font-size: 22px; line-height: 1; font-weight: 400; }
  .drawer-stats span { display: block; margin-top: 4px; font-size: 12px; color: #8fa8b8; }
  .hi { color: #8fd9c6; }
  .lo { color: #f0a882; }
  .drawer-close { position: absolute; top: 18px; right: 20px; z-index: 3; display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid rgb(255 255 255 / 22%); border-radius: 50%; background: none; color: #cfe0e8; cursor: pointer; font-size: 12px; transition: all 160ms ease; }
  .drawer-close:hover { background: rgb(255 255 255 / 14%); color: #fff; transform: rotate(90deg); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px 26px 24px; display: flex; flex-direction: column; gap: 12px; }
  .drawer-body > * { animation: rise-in 520ms cubic-bezier(.16,1,.3,1) both; }
  .drawer-body > *:nth-child(2) { animation-delay: 70ms; }
  .drawer-body > *:nth-child(3) { animation-delay: 140ms; }
  .drawer-body > *:nth-child(4) { animation-delay: 210ms; }
  .dcard { padding: 16px; border: 1px solid var(--terrain-card-line); border-radius: 12px; background: #fff; }
  .dcard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .dcard-head b { font-size: 12px; font-weight: 600; color: var(--heading); }
  .dcard-head small { font-size: 12px; color: var(--muted-cool); }
  .years { display: flex; align-items: flex-end; gap: 3px; height: 74px; }
  .years > div { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .years .fill { border-radius: 3px 3px 0 0; background: var(--terrain-dot); transform-origin: bottom; animation: bar-in 520ms cubic-bezier(.16,1,.3,1) both; }
  .years .top { margin-bottom: 2px; font-family: Georgia, serif; font-size: 12px; line-height: 1; text-align: center; color: var(--slate); }
  .year-axis { display: flex; gap: 3px; margin-top: 6px; }
  .year-axis span { flex: 1; text-align: center; font-size: 12px; color: var(--muted-cool-soft); font-variant-numeric: tabular-nums; }
  .year-axis span.peak { color: var(--slate); }
  .sys-row { margin-bottom: 10px; }
  .sys-row:last-child { margin-bottom: 0; }
  .sys-top { display: flex; align-items: baseline; gap: 8px; }
  .sys-top span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--heading); }
  .sys-top b { margin-left: auto; font-family: Georgia, serif; font-size: 12px; font-weight: 400; color: var(--slate); }
  .sys-track { height: 4px; margin-top: 4px; overflow: hidden; border-radius: 999px; background: var(--track); }
  .sys-track i { display: block; height: 100%; border-radius: 999px; transform-origin: left center; animation: sweep 650ms cubic-bezier(.16,1,.3,1) both; }
  .sys-row p { margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted-cool); }
  .more { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; margin-top: 4px; padding-top: 8px; border: 0; border-top: 1px dashed var(--line-cool); background: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--muted-cool); }
  .more:hover { color: var(--terrain-dot-on); }
  .stack { display: flex; gap: 2px; height: 13px; }
  .stack i { height: 100%; }
  .stack i:first-child { border-radius: 4px 0 0 4px; }
  .stack i:last-child { border-radius: 0 4px 4px 0; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; margin-top: 10px; }
  .legend div { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
  .legend i.sw { width: 8px; height: 8px; align-self: center; border-radius: 2px; }
  .legend span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--slate); }
  .legend b { margin-left: auto; font-family: Georgia, serif; font-weight: 400; color: var(--slate); }
  .legend em { width: 36px; flex: none; text-align: right; font-style: normal; color: var(--muted-cool); font-variant-numeric: tabular-nums; }
  .top-item { padding: 10px 0; border-bottom: 1px solid var(--line-cool-soft); }
  .top-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .top-item p { margin: 0; font-size: 12px; line-height: 20px; color: var(--heading); }
  .top-item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted-cool); }
  .m-badge { padding: 0 4px; border-radius: 4px; background: var(--selected-cool); color: var(--terrain-dot-on); font-family: Georgia, serif; }
  .drawer-foot { display: flex; align-items: center; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--line-cool); background: var(--canvas); }
  .drawer-foot span { font-size: 12px; color: var(--muted-cool); }
  .drawer-foot button { margin-left: auto; padding: 6px 12px; border: 1px solid var(--line-cool); border-radius: 6px; background: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--slate); }
  .drawer-foot button:hover { border-color: var(--terrain-dot-on); color: var(--terrain-dot-on); }

  footer { margin-top: 18px; font-size: 12px; line-height: 20px; color: var(--muted-cool); }
  footer code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--steel); }

  @keyframes bar-in { from { transform: scaleY(0); } to { transform: none; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(.94) translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide-in { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes sweep { from { transform: scaleX(0); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="head-line">

];

const W = 720, H = 434;
const PLOT = { left: 64, right: 700, top: 48, bottom: 374 };
const short = (n) => n.replace(/^自然科学基金-/, "");
const fmt = (n) => Number(n).toLocaleString("zh-CN", { maximumFractionDigits: 0 });
const pct = (v) => `${(Math.round(v * 10) / 10).toString().replace(/\.0$/, "")}%`;
const log10 = (v) => Math.log(v) / Math.LN10;
const coverage = (row, dim) => ((row.dimension_evidence || row.dimensions || {})[dim] || 0);
const esc = (t) => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* Sorted like the home page sorts them, so the default selection is the biggest library. */
const rows = DATA.filter((r) => (r.lineage.items || 0) > 0).sort((a, b) => b.projects - a.projects);
const textWidth = (text) => [...text].reduce((w, ch) => w + (/[\u3400-\u9fff]/.test(ch) ? 12 : 6.8), 0);

function cutOf(sizes) {
  const sorted = [...sizes].sort((a, b) => a - b);
  if (sorted.length < 2) return Math.max(1, sorted[0] || 100);
  let best = 0, at = -1;
  for (let i = 1; i < sorted.length; i += 1) {
    const ratio = sorted[i] / Math.max(1, sorted[i - 1]);
    if (ratio > best) { best = ratio; at = i; }
  }
  if (at < 1 || best < 2) return Math.max(1, Math.round(sorted[Math.floor(sorted.length / 2)]));
  return Math.max(10, 10 ** Math.round(log10(sorted[at - 1])));
}

function build(list) {
  const sizes = list.map((r) => r.lineage.items || 1);
  const avgs = list.map((r) => r.lineage.avg_maturity || 0);
  const projects = list.map((r) => Math.max(1, r.projects));
  const logs = sizes.map(log10);
  const domain = {
    x0: Math.floor(Math.min(...logs) * 10) / 10 - 0.06,
    x1: Math.ceil(Math.max(...logs) * 10) / 10 + 0.06,
    y0: Math.min(2.3, Math.floor(Math.min(...avgs) * 2) / 2 - 0.15),
    y1: Math.max(2.9, Math.ceil(Math.max(...avgs) * 2) / 2 + 0.3),
  };
  const biggest = Math.max(...projects);
  const px = (items) => PLOT.left + (log10(items) - domain.x0) / (domain.x1 - domain.x0) * (PLOT.right - PLOT.left);
  const py = (avg) => PLOT.bottom - (avg - domain.y0) / (domain.y1 - domain.y0) * (PLOT.bottom - PLOT.top);
  const points = list.map((row) => ({
    row, items: row.lineage.items, avg: row.lineage.avg_maturity || 0,
    cx: px(row.lineage.items), cy: py(row.lineage.avg_maturity || 0),
    r: 6.5 + Math.sqrt(Math.max(1, row.projects)) / Math.sqrt(biggest) * 11,
  }));
  return { points, cutX: cutOf(sizes), domain, px, py };
}

function seatLabels(points) {
  const seats = new Map();
  const taken = points.map((p) => ({ x0: p.cx - p.r - 6, y0: p.cy - p.r - 6, x1: p.cx + p.r + 6, y1: p.cy + p.r + 6 }));
  const overlap = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
  [...points].sort((a, b) => b.r - a.r).forEach((p) => {
    const label = short(p.row.name);
    const width = textWidth(label);
    const boxOf = (x, y, anchor) => {
      const x0 = anchor === "start" ? x : anchor === "end" ? x - width : x - width / 2;
      return { x0, x1: x0 + width, y0: y - 11, y1: y + 3 };
    };
    const options = [
      [p.cx + p.r + 10, p.cy + 4, "start"], [p.cx - p.r - 10, p.cy + 4, "end"],
      [p.cx, p.cy - p.r - 9, "middle"], [p.cx, p.cy + p.r + 16, "middle"],
      [p.cx + p.r + 10, p.cy - 11, "start"], [p.cx + p.r + 10, p.cy + 18, "start"],
      [p.cx - p.r - 10, p.cy - 11, "end"], [p.cx - p.r - 10, p.cy + 18, "end"],
    ];
    let best = { x: options[0][0], y: options[0][1], anchor: options[0][2] };
    let bestCost = Infinity;
    for (const [x, y, anchor] of options) {
      const raw = boxOf(x, y, anchor);
      const shift = raw.x0 < PLOT.left ? PLOT.left - raw.x0 : raw.x1 > PLOT.right ? PLOT.right - raw.x1 : 0;
      const box = boxOf(x + shift, y, anchor);
      const outside = box.y0 < PLOT.top + 2 || box.y1 > PLOT.bottom - 1 ? 500 : 0;
      const cost = outside + taken.reduce((sum, t) => sum + overlap(box, t), 0);
      if (cost < bestCost) { bestCost = cost; best = { x: x + shift, y, anchor }; }
      if (cost === 0) break;
    }
    seats.set(p.row.corpus_id, best);
    taken.push(boxOf(best.x, best.y, best.anchor));
  });
  return seats;
}

const model = build(rows);
const seats = seatLabels(model.points);
const totals = rows.reduce((acc, r) => {
  const own = r.lineage.maturity || [];
  return { dist: acc.dist.map((n, i) => n + (own[i] || 0)), projects: acc.projects + r.projects };
}, { dist: [0, 0, 0, 0, 0, 0], projects: 0 });
totals.items = totals.dist.reduce((a, b) => a + b, 0);
totals.high = totals.dist.slice(4).reduce((a, b) => a + b, 0);

const needsWork = (row) => {
  const share = row.lineage.high_share || 0;
  const total = Math.max(1, row.projects);
  const least = Math.min(...DIMS.map((d) => coverage(row, d) / total));
  return share < 20 || least < 0.95;
};
const quadOf = (row, cutX) => `${(row.lineage.avg_maturity || 0) >= 2.5 ? "t" : "b"}${(row.lineage.items || 0) >= cutX ? "r" : "l"}`;

const state = { chosen: rows[0] ? rows[0].corpus_id : null, mode: "all", pop: null, preview: null, expanded: false };
const chosenRow = () => rows.find((r) => r.corpus_id === state.chosen);

/* ------------------------------------------------------------------ */
/* the map                                                             */
/* ------------------------------------------------------------------ */
const xTicks = [30, 100, 300, 1000].filter((v) => log10(v) >= model.domain.x0 && log10(v) <= model.domain.x1);
const yTicks = [];
for (let v = Math.ceil(model.domain.y0 * 2) / 2; v <= model.domain.y1 + 0.001; v += 0.5) yTicks.push(Math.round(v * 10) / 10);
const quadOccupied = (key) => rows.some((r) => quadOf(r, model.cutX) === key);

function renderMap() {
  const parts = [];
  parts.push(`<rect x="${PLOT.left}" y="${PLOT.top}" width="${PLOT.right - PLOT.left}" height="${PLOT.bottom - PLOT.top}" fill="var(--terrain-plot)"/>`);
  parts.push(`<rect x="${PLOT.left}" y="${PLOT.top}" width="${model.px(model.cutX) - PLOT.left}" height="${model.py(2.5) - PLOT.top}" fill="var(--terrain-empty)"/>`);
  parts.push(`<rect x="${PLOT.left}" y="${model.py(2.5)}" width="${model.px(model.cutX) - PLOT.left}" height="${PLOT.bottom - model.py(2.5)}" fill="var(--terrain-shallow)"/>`);

  xTicks.forEach((value) => {
    parts.push(`<line x1="${model.px(value)}" y1="${PLOT.top}" x2="${model.px(value)}" y2="${PLOT.bottom}" stroke="var(--terrain-grid)" stroke-width=".7"/>`);
    parts.push(`<text class="tick" x="${model.px(value)}" y="${PLOT.bottom + 16}" text-anchor="middle">${value}</text>`);
  });
  yTicks.forEach((value) => {
    parts.push(`<line x1="${PLOT.left}" y1="${model.py(value)}" x2="${PLOT.right}" y2="${model.py(value)}" stroke="var(--terrain-grid)" stroke-width=".7"/>`);
    parts.push(`<text class="tick" x="${PLOT.left - 10}" y="${model.py(value) + 4}" text-anchor="end">${value.toFixed(1)}</text>`);
  });
  parts.push(`<line x1="${model.px(model.cutX)}" y1="${PLOT.top}" x2="${model.px(model.cutX)}" y2="${PLOT.bottom}" stroke="var(--terrain-sep)" stroke-width=".9" stroke-dasharray="4 5"/>`);
  parts.push(`<line x1="${PLOT.left}" y1="${model.py(2.5)}" x2="${PLOT.right}" y2="${model.py(2.5)}" stroke="var(--terrain-sep)" stroke-width=".9" stroke-dasharray="4 5"/>`);

  if (!quadOccupied("tr")) {
    const cx = (model.px(model.cutX) + PLOT.right) / 2, cy = (PLOT.top + model.py(2.5)) / 2;
    parts.push(`<g class="quad" data-quad="tr" role="button" tabindex="0">
      <rect x="${model.px(model.cutX)}" y="${PLOT.top}" width="${PLOT.right - model.px(model.cutX)}" height="${model.py(2.5) - PLOT.top}" fill="none" stroke="var(--line-cool-strong)" stroke-dasharray="6 6"/>
      <text class="q-empty" x="${cx}" y="${cy - 2}" text-anchor="middle">没有资料库</text>
      <text class="q-empty" x="${cx}" y="${cy + 15}" text-anchor="middle">既铺得开又沉得深</text></g>`);
  }

  const labels = {
    tl: [PLOT.left + 10, model.py(2.5) - 26, "小而精", "条目少 · 成熟高"],
    bl: [PLOT.left + 10, PLOT.bottom - 6, "少且浅", "条目少 · 成熟低"],
    br: [model.px(model.cutX) + 24, model.py(2.5) + 22, "铺得宽 · 沉不下去", "条目多 · 成熟低"],
    tr: [model.px(model.cutX) + 24, PLOT.top + 20, "量大且深", "条目多 · 成熟高"],
  };
  Object.entries(labels).forEach(([key, [x, y, title, sub]]) => {
    if (!quadOccupied(key) || key === "tr" && !quadOccupied("tr")) return;
    parts.push(`<g class="quad" data-quad="${key}" role="button" tabindex="0">
      <text class="q-label" x="${x}" y="${y}"><tspan x="${x}" font-weight="600">${title}</tspan><tspan x="${x}" dy="15">${sub}</tspan></text></g>`);
  });

  parts.push(`<text class="axis-title" x="${PLOT.right}" y="${PLOT.bottom + 36}" text-anchor="end">技术条目数（对数）→</text>`);
  parts.push(`<text class="axis-title" x="${PLOT.left}" y="${PLOT.top - 18}">平均成熟度 ↑</text>`);

  model.points.forEach((p) => {
    const on = p.row.corpus_id === state.chosen;
    parts.push(`<g class="dot-hit" data-id="${p.row.corpus_id}" role="button" tabindex="0"
      aria-label="${esc(short(p.row.name))}，${p.items} 条技术，平均成熟度 ${p.avg.toFixed(2)}">
      <circle class="halo" cx="${p.cx}" cy="${p.cy}" r="${p.r + 7}" fill="var(--terrain-halo)" opacity="${on ? .24 : 0}"/>
      <circle class="dot" cx="${p.cx}" cy="${p.cy}" r="${p.r}" fill="${on ? "var(--terrain-dot-on)" : "var(--terrain-dot)"}" fill-opacity=".92"/>
    </g>`);
  });
  model.points.forEach((p) => {
    const seat = seats.get(p.row.corpus_id);
    if (!seat) return;
    parts.push(`<text class="label" data-id="${p.row.corpus_id}" data-on="${p.row.corpus_id === state.chosen}"
      x="${seat.x}" y="${seat.y}" text-anchor="${seat.anchor}">${esc(short(p.row.name))}</text>`);
  });

  document.getElementById("map").innerHTML = parts.join("");
  applyMode();
}

function applyMode() {
  const gapMode = state.mode === "gap";
  model.points.forEach((p) => {
    const dim = gapMode && !needsWork(p.row);
    const g = document.querySelector(`.dot-hit[data-id="${p.row.corpus_id}"]`);
    const label = document.querySelector(`.label[data-id="${p.row.corpus_id}"]`);
    if (g) {
      const dot = g.querySelector(".dot");
      dot.setAttribute("fill-opacity", dim ? ".26" : ".92");
      g.querySelector(".halo").setAttribute("opacity", p.row.corpus_id === state.chosen ? (dim ? ".12" : ".24") : "0");
    }
    if (label) label.setAttribute("opacity", dim ? ".32" : "1");
  });
}

function tipHTML(row) {
  return `<b>${esc(short(row.name))}</b>
    <span class="k">技术条目</span> <b class="v">${fmt(row.lineage.items)}</b>
    <span class="k"> · 覆盖项目</span> ${row.projects}<br>
    <span class="k">平均成熟度</span> <b class="v">${(row.lineage.avg_maturity || 0).toFixed(2)}</b>
    <span class="k"> · 成熟 4 以上</span> ${pct(row.lineage.high_share || 0)}<br>
    <span class="k">技术体系</span> ${row.lineage.systems} 个`;
}
document.getElementById("map").addEventListener("mousemove", (event) => {
  const hit = event.target.closest(".dot-hit");
  if (!hit) { tip.hidden = true; return; }
  const row = rows.find((r) => r.corpus_id === hit.dataset.id);
  if (!row) return;
  tip.innerHTML = tipHTML(row);
  tip.hidden = false;
  const box = wrap.getBoundingClientRect();
  const left = event.clientX - box.left + 14;
  tip.style.left = `${left + 250 > box.width ? left - 264 : left}px`;
  tip.style.top = `${event.clientY - box.top + 14}px`;
});
document.getElementById("map").addEventListener("mouseleave", () => { tip.hidden = true; });
document.getElementById("map").addEventListener("click", (event) => {
  const hit = event.target.closest(".dot-hit");
  if (hit) { state.chosen = hit.dataset.id; tip.hidden = true; paintAll(); return; }
  const quad = event.target.closest(".quad");
  if (quad) openPop({ kind: "quadrant", quad: quad.dataset.quad }, quad);
});

/* ------------------------------------------------------------------ */
/* the right panel                                                     */
/* ------------------------------------------------------------------ */
function maturityBars(row) {
  const dist = row.lineage.maturity || [0, 0, 0, 0, 0, 0];
  const top = Math.max(1, ...dist);
  const total = Math.max(1, row.lineage.items || 0);
  const bars = dist.map((count, level) => {
    const h = count === 0 ? 2 : Math.max(4, Math.round(count / top * 52));
    const bg = count === 0 ? "var(--line-cool-soft)" : `var(--m-${level})`;
    return `<button type="button" class="bar" data-level="${level}" title="${MATURITY[level].name} · ${fmt(count)} 条 · ${pct(count / total * 100)}"
      style="height:${h}px;background:${bg};animation-delay:${level * 40}ms"></button>`;
  }).join("");
  return `<div class="bars">${bars}</div><div class="bars-axis">${[0, 1, 2, 3, 4, 5].map((n) => `<span>${n}</span>`).join("")}</div>`;
}

function dimRows(row) {
  const total = Math.max(1, row.projects);
  return DIMS.map((dim, index) => {
    const value = Math.min(1, coverage(row, dim) / total);
    const low = value < 0.95;
    return `<button type="button" class="dim" data-dim="${index}">
      <span>${dim}</span>
      <span class="track"><i class="fill" style="width:${value * 100}%;background:var(--dim-${["scene", "issue", "tech", "outcome"][index]})"></i>
        ${low ? `<i class="gap" style="left:${value * 100}%"></i>` : ""}</span>
      <b class="${low ? "low" : ""}">${pct(value * 100)}</b></button>`;
  }).join("");
}

function renderPanel() {
  const row = chosenRow();
  const panel = document.getElementById("panel");
  if (!row) { panel.innerHTML = `<p style="color:var(--steel)">选择一个资料库，查看它的积累厚度。</p>`; return; }
  const total = Math.max(1, row.projects);
  const highShare = row.lineage.high_share || 0;
  const values = DIMS.map((d) => coverage(row, d) / total);
  const least = Math.min(...values);
  const leastIndex = values.indexOf(least);
  const notes = [];
  if (highShare < 10) notes.push(`${fmt(row.lineage.items)} 条技术里仅 ${fmt(row.lineage.high_maturity || 0)} 条（${pct(highShare)}）进了场景试验或转化`);
  if (least < 0.95) notes.push(`${Math.round(total - coverage(row, DIMS[leastIndex]))} 个项目的材料里没有归纳出「${DIMS[leastIndex]}」，覆盖 ${pct(least * 100)}`);

  panel.innerHTML = `
    <div class="eyebrow"><p>CURRENT LIBRARY</p><span>${row.lineage.systems} 个体系</span></div>
    <h3 title="${esc(short(row.name))}">${esc(short(row.name))}</h3>

    <div class="stats">
      <div><b class="big">${fmt(row.projects)}</b><small>个项目</small></div>
      <div><b class="big">${fmt(row.files)}</b><small>份资料</small></div>
    </div>

    <div class="stats" style="border-top:0">
      <div><b class="big stat">${fmt(row.lineage.items)}</b><small>条技术</small></div>
      <div style="text-align:right"><b class="big ${highShare >= 20 ? "ok" : "warn"}">${pct(highShare)}</b><small>成熟 4 以上</small></div>
    </div>

    <div class="block">
      <div class="block-head"><span>成熟度分布</span>
        <button type="button" class="pill" data-pop="maturity">0–5 怎么分?</button></div>
      ${maturityBars(row)}
    </div>

    <div class="block">
      <div class="block-head"><span>四维覆盖</span><em>点一项看口径</em></div>
      <div class="dims">${dimRows(row)}</div>
    </div>

    ${notes.slice(0, 2).map((note) => `<p class="note-warn"><span>&#9873;</span><span>${esc(note)}</span></p>`).join("")}

    <div class="preview"><button type="button" data-preview="1">预览资料库 <i style="font-style:normal">→</i></button></div>`;
}

/* ------------------------------------------------------------------ */
/* the readout                                                         */
/* ------------------------------------------------------------------ */
function renderReadout() {
  const items = Math.max(1, totals.items);
  const shallow = (totals.dist[0] + totals.dist[1] + totals.dist[2]) / items;
  const proto = totals.dist[3] / items;
  const applied = (totals.dist[4] + totals.dist[5]) / items;
  const biggest = [...rows].sort((a, b) => b.lineage.items - a.lineage.items).slice(0, 2);
  const bulk = biggest.reduce((n, r) => n + r.lineage.items, 0);
  const bulkHigh = biggest.reduce((n, r) => n + (r.lineage.high_maturity || 0), 0);
  const worst = [...rows].filter((r) => r.lineage.items >= model.cutX).sort((a, b) => (a.lineage.high_share || 0) - (b.lineage.high_share || 0))[0]
    || [...rows].sort((a, b) => (a.lineage.high_share || 0) - (b.lineage.high_share || 0))[0];
  const worstLow = worst ? (worst.lineage.maturity || [0, 0, 0, 0, 0, 0]).slice(0, 2).reduce((a, b) => a + b, 0) / Math.max(1, worst.lineage.items) : 0;
  const worstShares = worst ? DIMS.map((d) => coverage(worst, d) / Math.max(1, worst.projects)) : [1];
  const worstDim = Math.min(...worstShares);
  const worstDimName = worst ? DIMS[worstShares.indexOf(worstDim)] : "";

  const cols = [
    `<p class="label">全库成熟度</p><p class="text">${fmt(totals.items)} 条技术中，<em>${pct(shallow * 100)} 停在算法验证及以下</em>，
      ${pct(proto * 100)} 做出原型样机，<b>${pct(applied * 100)}</b>（${fmt(totals.high)} 条）进入真实场景或转化。</p>`,
    `<p class="label">体量与沉淀</p><p class="text">${biggest.map((r) => short(r.name)).join(" + ")} 占 <b>${pct(bulk / items * 100)}</b> 技术条目，
      高成熟条目占 ${pct(totals.high ? bulkHigh / totals.high * 100 : 0)}；
      ${rows.some((r) => (r.lineage.items || 0) >= model.cutX && (r.lineage.avg_maturity || 0) >= 2.5)
        ? "其中已有库同时做到量大与深。" : `<em>没有库同时做到量大与深</em>`}。</p>`,
    worst ? `<p class="label">最需注意</p><p class="text">${short(worst.name)} <b>${fmt(worst.lineage.items)}</b> 条技术，
      <em>${pct(worstLow * 100)} 停在理论与未判定</em>；
      ${worstDim < 0.95 ? `${worstDimName}维仅 ${pct(worstDim * 100)} 的项目有归纳。` : "四维覆盖齐全。"}</p>` : "",
  ];
  document.getElementById("readout").innerHTML = cols.filter(Boolean).map((html) => `<div>${html}</div>`).join("");
}

/* ------------------------------------------------------------------ */
/* explanations: anchored cards                                        */
/* ------------------------------------------------------------------ */
const popWidths = { axis: 344, maturity: 396, dimension: 344, quadrant: 348 };
function meanOf(dist) {
  const total = dist.reduce((a, b) => a + b, 0);
  return total ? dist.reduce((sum, n, level) => sum + n * level, 0) / total : 0;
}
const sec = (label, text) => `<div class="sec"><b>${label}</b><p>${text}</p></div>`;
const head = (title, sub) => `<h4>${title}</h4><p class="sub">${sub}</p>`;

function popBody(spec) {
  const items = totals.items;
  const sizes = rows.map((r) => r.lineage.items || 0).filter(Boolean);
  const lowX = Math.min(...sizes), highX = Math.max(...sizes);
  const row = chosenRow();

  if (spec.kind === "axis") {
    if (spec.axis === "x") return head("横轴 · 技术条目数", "衡量这个库攒下多少条可追踪的技术线索")
      + sec("怎么算", `取技术谱系的条目计数。同一技术在多个项目下出现会各计一次，所以它不等于「会多少种技术」，而是「攒了多少条记录」。全库现有 ${fmt(items)} 条。`)
      + sec("为什么用对数", `各库从 ${fmt(lowX)} 条到 ${fmt(highX)} 条，相差 ${Math.round(highX / Math.max(1, lowX))} 倍。线性轴会把小库全压在左边缘，看不出差别。`);
    if (spec.axis === "y") return head("纵轴 · 平均成熟度", "衡量这些条目整体走到了哪一步")
      + sec("怎么算", `对该库全部条目的成熟度取算术平均，0 档也计入。全库均值 ${meanOf(totals.dist).toFixed(2)}。`)
      + sec("为什么低不等于差", "条目越多，越容易混进大量低成熟条目，均值被拖低。同样 2.0，可能是「均匀分布在 2 档」，也可能是「一半 0 档、一半 4 档」——要配合右栏的 6 档分布一起看。");
    return head("圆面积 · 覆盖项目数", "衡量这个库压住了多少个项目")
      + sec("怎么算", "条目里出现过的项目编号去重后计数，一定小于等于该库的项目总数；差额是还没归入任何技术条目的项目。")
      + sec("为什么半径开方", "半径按覆盖项目数开方换算，让面积正比于数量，否则大库在视觉上会被放大好几倍。");
  }

  if (spec.kind === "maturity") {
    const steps = MATURITY.map((m) => {
      const count = totals.dist[m.n] || 0;
      const share = items ? Math.round(count / items * 100) : 0;
      return `<div class="step"><span class="n" style="background:var(--m-${m.n});color:${m.n === 5 ? "#fff" : "var(--heading)"}">${m.n}</span>
        <div><div class="t">${m.name}</div><div class="d">${m.read}<span style="color:var(--muted-cool-soft)">　· ${m.eg}</span></div></div>
        <span class="c"><b>${fmt(count)}</b>${share}%</span></div>`;
    }).join("");
    return head("技术成熟度 6 档", `右侧是全库 ${fmt(items)} 条的分布；点右栏阶梯条可定位到该档`) + steps
      + `<p class="amber"><b>档位名称</b>取自后端 maturity_levels 常量；灰色小字是本页补充的判据。级别由模型逐条判定并附依据，需人工核对，不作质量评级。</p>`;
  }

  if (spec.kind === "dimension") {
    if (!row) return head("四维覆盖", "选择一个资料库后查看这一维的覆盖");
    const name = DIMS[spec.index];
    const done = coverage(row, name);
    const total = row.projects;
    const share = total ? done / total * 100 : 0;
    const gap = Math.max(0, total - done);
    return head(`${name}维 · ${pct(share)}`, `${short(row.name)}　${done} / ${total} 个项目的材料里归纳出该维内容`)
      + sec("这一维在问什么", DIM_MEANING[spec.index])
      + `<p class="amber">${gap > 0
        ? `还有 <b>${gap} 个</b>项目的材料里没有归纳出「${name}」。这部分在数据里是空的，不代表没有，只代表还没抽出来。`
        : "这一维基本抽全了，可作为其他维度抽取质量的参照。"}</p>`;
  }

  const inQuad = rows.filter((r) => quadOf(r, model.cutX) === spec.quad).sort((a, b) => b.lineage.items - a.lineage.items);
  const copy = QUAD_TEXT[spec.quad];
  return head(copy.title, copy.sub)
    + sec(inQuad.length ? "谁在这里" : "为什么是空的", inQuad.length
      ? inQuad.map((r) => `${short(r.name)}（${r.lineage.items} 条 / ${(r.lineage.avg_maturity || 0).toFixed(2)}）`).join("、")
      : "没有任何资料库落在这一格。")
    + sec("该怎么读", copy.read)
    + sec("分割线怎么定", `横轴切在 ${model.cutX} 条：这是当前条目数排序里最靠右的一处断层，越过它的库与小库之间差一个量级。纵轴切在 2.5：这是 6 档里「算法与模型验证」与「原型与样机验证」的中点，越过它意味着平均做出过可运行的东西。`);
}

function openPop(spec, anchor) {
  if (state.pop && state.pop.key === JSON.stringify(spec)) { closePop(); return; }
  closePop();
  const width = popWidths[spec.kind] || 344;
  const el = document.createElement("div");
  el.className = "pop";
  el.style.width = `${width}px`;
  el.innerHTML = `<div class="pop-card" role="dialog" aria-label="口径说明"><i class="pop-arrow" data-up="false"></i>${popBody(spec)}</div>`;
  document.body.appendChild(el);
  const card = el.querySelector(".pop-card");
  const place = () => {
    const rect = anchor.getBoundingClientRect();
    const height = card.offsetHeight || 220;
    const vw = window.innerWidth, vh = window.innerHeight, gap = 12;
    const below = rect.bottom + gap + height < vh - 10 || rect.top - gap - height < 10;
    const top = Math.max(10, Math.min(below ? rect.bottom + gap : rect.top - gap - height, vh - height - 10));
    const left = Math.max(12, Math.min(rect.left + rect.width / 2 - width / 2, vw - width - 12));
    const arrow = Math.max(18, Math.min(rect.left + rect.width / 2 - left, width - 18));
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    card.style.setProperty("--ox", `${arrow}px`);
    card.style.setProperty("--oy", below ? "0" : "100%");
    const tipEl = card.querySelector(".pop-arrow");
    tipEl.dataset.up = String(!below);
    tipEl.style.left = `${arrow}px`;
  };
  place();
  state.pop = { key: JSON.stringify(spec), el, follow: place };
  window.addEventListener("scroll", place, true);
  window.addEventListener("resize", place);
}
function closePop() {
  if (!state.pop) return;
  window.removeEventListener("scroll", state.pop.follow, true);
  window.removeEventListener("resize", state.pop.follow);
  state.pop.el.remove();
  state.pop = null;
}

/* ------------------------------------------------------------------ */
/* the preview drawer                                                  */
/* ------------------------------------------------------------------ */
function drawerHTML(row) {
  const systems = row.lineage.systems_detail || [];
  const top = row.lineage.top || [];
  const highest = systems.length ? systems[0].items : 1;
  const dist = row.lineage.maturity || [0, 0, 0, 0, 0, 0];
  const items = Math.max(1, row.lineage.items || 0);
  const years = row.start_years && row.start_years.length
    ? Array.from({ length: row.start_years.at(-1) - row.start_years[0] + 1 }, (_, i) => row.start_years[0] + i) : [];
  const counts = years.map((y) => (row.by_year || {})[String(y)] || 0);
  const peak = Math.max(1, ...counts);
  const peakIndex = counts.indexOf(Math.max(...counts));
  const money = Number(row.funding.total_yuan) / 10000;
  const share = row.lineage.high_share || 0;
  const expanded = state.expanded;
  const shown = expanded ? systems : systems.slice(0, 5);

  const yearCard = years.length ? `<section class="dcard">
    <div class="dcard-head"><b>年度立项</b><small>${row.funding.projects
      ? `已知${row.funding.label || "经费"} ${fmt(money)} 万元（${row.funding.projects} 个项目给出金额）` : "报告未给出经费金额"}</small></div>
    <div class="years">${years.map((y, i) => `<div title="${y} 年：${fmt(counts[i])} 个项目">
      ${i === peakIndex && counts[i] ? `<span class="top">${fmt(counts[i])}</span>` : ""}
      <div class="fill" style="height:${counts[i] ? Math.max(3, counts[i] / peak * 58) : 2}px;opacity:${counts[i] ? 1 : .35};animation-delay:${i * 26}ms"></div></div>`).join("")}</div>
    <div class="year-axis">${years.map((y, i) => `<span class="${i === peakIndex ? "peak" : ""}">${years.length > 8 ? String(y).slice(2) : y}</span>`).join("")}</div>
    <p style="margin:8px 0 0;font-size:12px;line-height:20px;color:var(--muted-cool)">按项目立项年份计，跨库未去重；柱高为当年项目数，空柱表示该年没有立项记录。</p>
  </section>` : "";

  const sysCard = systems.length ? `<section class="dcard">
    <div class="dcard-head"><b>技术体系构成</b><small>共 ${row.lineage.systems} 个体系 · 按条目数排序</small></div>
    ${shown.map((system, index) => `<div class="sys-row">
      <div class="sys-top"><span title="${esc(system.name)}">${esc(system.name)}</span><b>${fmt(system.items)}</b></div>
      <div class="sys-track"><i style="width:${Math.max(2, system.items / highest * 100)}%;background:${index ? "var(--dim-scene)" : "var(--terrain-dot-on)"};animation-delay:${index * 45}ms"></i></div>
      ${system.plain ? `<p title="${esc(system.plain)}">${esc(system.plain)}</p>` : ""}</div>`).join("")}
    ${systems.length > 5 ? `<button type="button" class="more" data-more="1">${expanded ? "收起" : `展开其余 ${systems.length - 5} 个体系`}<i style="font-style:normal">${expanded ? "↑" : "↓"}</i></button>` : ""}
  </section>` : "";

  const distCard = `<section class="dcard">
    <div class="dcard-head"><b>成熟度分布</b><small>0 未判定 → 5 示范转化 · 共 ${fmt(row.lineage.items)} 条</small></div>
    <div class="stack">${dist.map((count, level) => count ? `<i style="flex:${count};background:var(--m-${level})" title="${MATURITY[level].name}：${fmt(count)} 条"></i>` : "").join("")}</div>
    <div class="legend">${dist.map((count, level) => `<div>
      <i class="sw" style="background:var(--m-${level})"></i>
      <span title="${MATURITY[level].name}">${level} ${MATURITY[level].name}</span>
      <b>${fmt(count)}</b><em>${pct(count / items * 100)}</em></div>`).join("")}</div>
  </section>`;

  const topCard = `<section class="dcard">
    <div class="dcard-head"><b>进入场景试验或转化的条目</b><small>共 ${fmt(row.lineage.high_maturity || 0)} 条${top.length ? ` · 取前 ${top.length}` : ""}</small></div>
    ${top.length ? top.map((item) => `<div class="top-item">
      <p>${esc(item.name.length > 40 ? `${item.name.slice(0, 40)}…` : item.name)}</p>
      <p class="meta"><span class="m-badge">M${item.maturity}</span>
        ${item.field ? `<span style="color:var(--muted-cool-soft)">${esc(item.field)}</span>` : ""}
        ${item.basis ? `<span>${esc(item.basis.length > 34 ? `${item.basis.slice(0, 34)}…` : item.basis)}</span>` : ""}</p></div>`).join("")
      : `<p style="padding:12px 0;text-align:center;font-size:12px;color:var(--muted-cool)">这个库还没有条目达到成熟度 4，全部停在理论与算法验证之间。</p>`}
  </section>`;

  return `<div class="mask" data-close="1"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(short(row.name))} 资料库预览">
      <div class="drawer-head">
        <button type="button" class="drawer-close" data-close="1" aria-label="关闭预览">✕</button>
        <p class="eyebrow">LIBRARY PREVIEW</p>
        <h2>${esc(short(row.name))}</h2>
        <p class="meta">${row.start_years && row.start_years.length ? `${row.start_years[0]}–${row.start_years.at(-1)} 年立项` : "立项年份待核对"}
          · ${row.lineage.systems} 个技术体系</p>
        <div class="drawer-stats">
          <div><b>${fmt(row.projects)}</b><span>个项目</span></div>
          <div><b>${fmt(row.files)}</b><span>份资料</span></div>
          <div><b>${fmt(row.lineage.items)}</b><span>条技术</span></div>
          <div><b class="${share >= 20 ? "hi" : "lo"}">${pct(share)}</b><span>成熟 4 以上</span></div>
        </div>
      </div>
      <div class="drawer-body">${yearCard}${sysCard}${distCard}${topCard}</div>
      <div class="drawer-foot"><span>只读摘要 · 数据取技术谱系与项目索引</span>
        <button type="button" data-close="1">进入资料库 →</button></div>
    </aside>`;
}

function wireDrawer(host, row) {
  host.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", closeDrawer));
  const more = host.querySelector("[data-more]");
  if (!more) return;
  more.addEventListener("click", () => {
    const body = host.querySelector(".drawer-body");
    const at = body ? body.scrollTop : 0;
    state.expanded = !state.expanded;
    host.innerHTML = drawerHTML(row);
    wireDrawer(host, row);
    const next = host.querySelector(".drawer-body");
    if (next) next.scrollTop = at;
  });
}

function openDrawer(row) {
  state.preview = row.corpus_id;
  state.expanded = false;
  const host = document.createElement("div");
  host.id = "drawer-host";
  host.innerHTML = drawerHTML(row);
  document.body.appendChild(host);
  wireDrawer(host, row);
}
function closeDrawer() {
  const host = document.getElementById("drawer-host");
  if (host) host.remove();
  state.preview = null;
}

/* demo helper: the screenshot pass closes every layer between steps */
window.demoClose = () => { closePop(); closeDrawer(); };

/* ------------------------------------------------------------------ */
/* wiring                                                              */
/* ------------------------------------------------------------------ */
function paintAll() {
  renderPanel();
  applyMode();
  document.querySelectorAll(".label").forEach((el) => el.dataset.on = String(el.dataset.id === state.chosen));
  model.points.forEach((p) => {
    const g = document.querySelector(`.dot-hit[data-id="${p.row.corpus_id}"]`);
    if (!g) return;
    const on = p.row.corpus_id === state.chosen;
    g.querySelector(".dot").setAttribute("fill", on ? "var(--terrain-dot-on)" : "var(--terrain-dot)");
    g.querySelector(".halo").setAttribute("opacity", on ? ".24" : "0");
  });
  applyMode();
}

document.getElementById("n-libs").textContent = rows.length;
document.getElementById("axes").innerHTML = [
  ["x", "横轴", "技术条目数", "对数"], ["y", "纵轴", "平均成熟度", "0–5"], ["area", "圆面积", "覆盖项目数", ""],
].map(([axis, name, what, note]) => `<button type="button" class="caliber" data-axis="${axis}">
  ${name} <b>${what}</b>${note ? ` <span style="color:var(--muted-cool-soft)">${note}</span>` : ""} <i>i</i></button>`).join("");

document.querySelector(".card-head").addEventListener("click", (event) => {
  const axis = event.target.closest("[data-axis]");
  if (axis) { openPop({ kind: "axis", axis: axis.dataset.axis }, axis); return; }
  if (event.target.closest("#f-all")) { state.mode = "all"; syncFilters(); applyMode(); return; }
  if (event.target.closest("#f-gap")) { state.mode = "gap"; syncFilters(); applyMode(); }
});
function syncFilters() {
  document.getElementById("f-all").setAttribute("aria-pressed", String(state.mode === "all"));
  document.getElementById("f-gap").setAttribute("aria-pressed", String(state.mode === "gap"));
}

document.getElementById("panel").addEventListener("click", (event) => {
  const pill = event.target.closest("[data-pop='maturity']");
  if (pill) { openPop({ kind: "maturity" }, pill); return; }
  const dim = event.target.closest("[data-dim]");
  if (dim) { openPop({ kind: "dimension", index: Number(dim.dataset.dim) }, dim); return; }
  const bar = event.target.closest(".bar");
  if (bar) { openPop({ kind: "maturity", at: Number(bar.dataset.level) }, bar); return; }
  const prev = event.target.closest("[data-preview]");
  if (prev) { const row = chosenRow(); if (row) openDrawer(row); }
});

document.addEventListener("click", (event) => {
  if (!state.pop) return;
  if (state.pop.el.contains(event.target)) return;
  if (event.target.closest("[data-axis],[data-pop='maturity'],[data-dim],.bar,.quad")) return;
  closePop();
});
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if (document.getElementById("drawer-host")) { closeDrawer(); return; }
  closePop();
});

document.getElementById("map").addEventListener("keydown", (event) => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const hit = event.target.closest(".dot-hit");
  if (hit) { event.preventDefault(); state.chosen = hit.dataset.id; paintAll(); }
});
document.getElementById("drawer-host") || null;

renderMap();
paintAll();
renderReadout();

const dates = rows.flatMap((r) => r.start_years || []);
document.getElementById("foot").innerHTML = `数据来自 <code>.knowledge/自然科学基金-*</code> 的 lineage、四维归纳与项目索引：
  ${rows.length} 个资料库 · ${fmt(totals.items)} 条技术 · ${fmt(totals.projects)} 个项目 · 立项 ${Math.min(...dates)}–${Math.max(...dates)}。
  成熟度为模型逐条判定并附依据，需人工核对；项目数在各库内去重、跨库未去重。demo 生成于 2026-10-21，与 <code>frontend/src/components/LibraryTerrain.tsx</code> 同构。`;
</script>
</body>
</html>
